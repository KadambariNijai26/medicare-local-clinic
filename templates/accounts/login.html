{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Medicare | Login</title>

    <link rel="stylesheet"
          href="{% static 'css/login.css' %}">

</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">

            <!-- Logo -->

            <div class="logo-circle">
                M
            </div>


            <!-- Brand -->

            <h1 class="brand-name">
                Medicare
            </h1>

            <p class="brand-subtitle">
                Local Clinic Management System
            </p>


            <!-- Messages -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- Login Form -->

            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

            </form>


            <!-- Footer -->
          <div class="register-section">

    <p>
        Are you a new User?
        <a href="{% url 'register' %}">
            Register here
        </a>
    </p>

</div>

<div class="login-footer">
    Secure Clinic Management System
</div>
            <div class="login-footer">

                Secure Clinic Management System

            </div>

        </div>

    </div>

</body>

</html>
